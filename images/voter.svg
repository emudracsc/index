<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#0E6206" />
    </linearGradient>
  </defs>

  <!-- ECI / Voter Emblem -->
  <g transform="translate(20, 15)">
    <!-- Tricolor Ring -->
    <circle cx="45" cy="45" r="42" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <path d="M 45 6 A 39 39 0 0 1 84 45" fill="none" stroke="url(#saffronGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M 6 45 A 39 39 0 0 0 45 84" fill="none" stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Inked Finger / Ballot Mark Motif -->
    <rect x="40" y="22" width="10" height="34" rx="5" fill="#000080" />
    <circle cx="45" cy="22" r="3" fill="#6A1B9A" />
    <!-- Ballot Checkmark -->
    <path d="M 32 48 L 42 58 L 62 36" fill="none" stroke="#138808" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ECI Text -->
  <g transform="translate(115, 20)">
    <text x="0" y="24" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-weight="800" font-size="19" fill="#1E293B">भारत निवडणूक आयोग</text>
    <text x="0" y="44" font-family="'Poppins', 'Arial', sans-serif" font-weight="700" font-size="12" fill="#475569" letter-spacing="0.5">ELECTION COMMISSION</text>
    
    <!-- Voter Card Badge -->
    <rect x="0" y="56" width="165" height="24" rx="12" fill="url(#saffronGrad)" />
    <text x="82" y="72" font-family="'Poppins', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">VOTER ID (EPIC)</text>
  </g>
</svg>
