<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Filter for clean drop shadow -->
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    <linearGradient id="saffronGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7722" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#0E7034" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Circular White / Light Card Container -->
  <circle cx="300" cy="300" r="285" fill="#FFFFFF" stroke="url(#goldBorder)" stroke-width="10" filter="url(#badgeShadow)"/>
  <circle cx="300" cy="300" r="268" fill="#FAFAF9" stroke="#E2E8F0" stroke-width="2" />

  <!-- Outer Arc Header: Maharashtra Shasan -->
  <path id="headerArc" d="M 80,300 A 220,220 0 0,1 520,300" fill="none" />
  <text font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-weight="900" font-size="24" fill="#0E7034" letter-spacing="4">
    <textPath href="#headerArc" startOffset="50%" text-anchor="middle">
      ★ महाराष्ट्र शासन • आपले सरकार ★
    </textPath>
  </text>

  <!-- Left Side Motif: Vidhan Bhavan + Hands holding India Flag -->
  <g transform="translate(60, 110)">
    <!-- Vidhan Bhavan Dome Architecture -->
    <!-- Dome Base & Pillars -->
    <path d="M 40 180 L 180 180 L 175 190 L 45 190 Z" fill="#94A3B8" />
    <!-- Pillars Base -->
    <rect x="55" y="145" width="8" height="35" rx="2" fill="#64748B" />
    <rect x="75" y="145" width="8" height="35" rx="2" fill="#64748B" />
    <rect x="95" y="145" width="8" height="35" rx="2" fill="#64748B" />
    <rect x="115" y="145" width="8" height="35" rx="2" fill="#64748B" />
    <rect x="135" y="145" width="8" height="35" rx="2" fill="#64748B" />
    <rect x="155" y="145" width="8" height="35" rx="2" fill="#64748B" />
    
    <!-- Central Portico Triangle -->
    <path d="M 85 145 L 135 145 L 110 120 Z" fill="#CBD5E1" stroke="#64748B" stroke-width="2" />

    <!-- Main Round Dome -->
    <path d="M 60 120 C 60 40, 160 40, 160 120 Z" fill="#E2E8F0" stroke="#64748B" stroke-width="3" />
    <!-- Dome inner arches -->
    <path d="M 80 120 C 80 70, 140 70, 140 120" fill="none" stroke="#94A3B8" stroke-width="2" />
    
    <!-- Top Saffron/Tricolor Flag on Dome -->
    <line x1="110" y1="40" x2="110" y2="10" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <path d="M 110 10 L 145 10 L 140 22 L 145 34 L 110 34 Z" fill="url(#saffronGradient)" />

    <!-- Protective Hands holding Tricolor Card Emblem -->
    <!-- Tricolor ID Card / Citizen Service -->
    <rect x="62" y="195" width="96" height="60" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" filter="url(#badgeShadow)" />
    <!-- Saffron top bar -->
    <path d="M 64 197 Q 110 197 156 197 L 156 217 L 64 217 Z" fill="#FF7722" />
    <!-- White middle bar with Ashoka Chakra -->
    <rect x="64" y="217" width="92" height="18" fill="#FFFFFF" />
    <circle cx="110" cy="226" r="6" fill="none" stroke="#000080" stroke-width="1.5" />
    <!-- Green bottom bar -->
    <path d="M 64 235 L 156 235 L 156 253 Q 110 253 64 253 Z" fill="#16A34A" />

    <!-- Left Hand -->
    <path d="M 45 285 C 40 250, 48 215, 60 200 C 63 196, 68 200, 66 206 C 58 220, 56 245, 62 275" fill="#FED7AA" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right Hand -->
    <path d="M 175 285 C 180 250, 172 215, 160 200 C 157 196, 152 200, 154 206 C 162 220, 164 245, 158 275" fill="#FED7AA" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Right Side: Official Aaple Sarkar Typography -->
  <g transform="translate(275, 160)">
    <!-- 'आपले' in Bold Emerald Green -->
    <text x="20" y="90" font-family="'Mukta', 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-weight="900" font-size="88" fill="#0E7034" letter-spacing="-1">
      आपले
    </text>

    <!-- 'सरकार' in Bold Saffron / Orange -->
    <text x="20" y="175" font-family="'Mukta', 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-weight="900" font-size="94" fill="#F15A24" letter-spacing="1">
      सरकार
    </text>

    <!-- Divider Bar -->
    <rect x="22" y="200" width="260" height="5" rx="2.5" fill="#F97316" />

    <!-- Subtitle: महाराष्ट्र शासन -->
    <text x="22" y="240" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-weight="800" font-size="28" fill="#1E293B" letter-spacing="1">
      महाराष्ट्र शासन
    </text>

    <!-- English sub: GOVT OF MAHARASHTRA -->
    <text x="22" y="265" font-family="'Poppins', 'Arial', sans-serif" font-weight="800" font-size="13" fill="#64748B" letter-spacing="2">
      GOVT. OF MAHARASHTRA
    </text>
  </g>

  <!-- Bottom Tag Badge -->
  <g transform="translate(160, 485)">
    <rect x="0" y="0" width="280" height="42" rx="21" fill="url(#saffronGradient)" filter="url(#badgeShadow)" />
    <text x="140" y="27" font-family="'Mukta', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      आपले सरकार सेवा केंद्र
    </text>
  </g>
</svg>
