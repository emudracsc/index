<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- PAN Card / Income Tax Seal -->
  <g transform="translate(20, 15)">
    <!-- Outer Badge -->
    <circle cx="45" cy="45" r="42" fill="#F8FAFC" stroke="url(#panGrad)" stroke-width="3" />
    <circle cx="45" cy="45" r="36" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="3 2" />
    
    <!-- Ashok Stambh / Gov Emblem Icon -->
    <path d="M 45 22 L 48 30 L 56 30 L 50 35 L 52 43 L 45 38 L 38 43 L 40 35 L 34 30 L 42 30 Z" fill="url(#goldGrad)" />
    
    <!-- Central Shield / Card Shape -->
    <rect x="28" y="44" width="34" height="22" rx="3" fill="url(#panGrad)" />
    <rect x="32" y="49" width="10" height="7" rx="1.5" fill="#FDE047" />
    <line x1="46" y1="51" x2="58" y2="51" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="46" y1="56" x2="56" y2="56" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="32" y1="61" x2="58" y2="61" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Income Tax Department Text -->
  <g transform="translate(115, 22)">
    <text x="0" y="24" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-weight="800" font-size="20" fill="#0369A1">आयकर विभाग</text>
    <text x="0" y="46" font-family="'Poppins', 'Arial', sans-serif" font-weight="700" font-size="14" fill="#0F172A" letter-spacing="0.5">INCOME TAX DEPT</text>
    
    <!-- PAN Badge -->
    <rect x="0" y="58" width="165" height="24" rx="12" fill="#0284C7" />
    <text x="82" y="74" font-family="'Poppins', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PAN CARD SEVA</text>
  </g>
</svg>
