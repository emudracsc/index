<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123">
  <!-- A4 Dimensions: 794 x 1123 px at 96 DPI -->
  <defs>
    <style>
      .bold-txt { font-family: Arial, Helvetica, sans-serif; font-weight: bold; }
      .norm-txt { font-family: Arial, Helvetica, sans-serif; }
      .red-bar { fill: #C81E1E; }
      .navy-bar { fill: #1B2A4A; }
      .green-bar { fill: #E2FBE8; stroke: #86EFAC; stroke-width: 0.8; }
      .box-stroke { stroke: #000000; stroke-width: 0.8; fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background Paper -->
  <rect width="794" height="1123" fill="#FFFFFF"/>

  <!-- UIDAI Sun Logo (Left) -->
  <g transform="translate(35, 22)">
    <!-- Sun rays -->
    <path d="M 22 8 L 22 2 M 30 11 L 35 6 M 35 20 L 41 20 M 33 29 L 38 34 M 27 37 L 30 43 M 17 37 L 14 43 M 11 29 L 6 34 M 9 20 L 3 20 M 14 11 L 9 6" stroke="#E23E1D" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 14 25 C 14 15, 30 15, 30 25 C 30 31, 25 35, 22 37 C 19 35, 14 31, 14 25 Z" fill="#E23E1D"/>
    <!-- Fingerprint motif -->
    <path d="M 18 26 C 18 22, 26 22, 26 26 C 26 29, 23 31, 22 32 C 21 31, 18 29, 18 26 Z" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Title Left: Mera Aadhaar Meri Pehchaan -->
  <text x="82" y="38" class="bold-txt" font-size="16" fill="#D97706">Mera Aadhaar</text>
  <text x="82" y="55" class="bold-txt" font-size="16" fill="#166534">Meri Pehchaan</text>

  <!-- Title Right: Unique Identification Authority of India -->
  <text x="758" y="38" class="bold-txt" font-size="17" fill="#0F172A" text-anchor="end">Unique Identification</text>
  <text x="758" y="55" class="bold-txt" font-size="15" fill="#1E293B" text-anchor="end">Authority of India</text>

  <!-- Tricolor Stripe -->
  <rect x="35" y="66" width="724" height="4.5" rx="1" fill="#FF9933"/>
  <rect x="276" y="66" width="242" height="4.5" fill="#FFFFFF"/>
  <rect x="518" y="66" width="241" height="4.5" rx="1" fill="#138808"/>

  <!-- Red Header Banner -->
  <rect x="35" y="76" width="724" height="24" fill="#C81E1E"/>
  <text x="397" y="92.5" class="bold-txt" font-size="11.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">CERTIFICATE FOR AADHAAR ENROLMENT/ UPDATE (TO BE USED ONLY AS PROOF OF ADDRESS*)</text>

  <!-- Subheader Text -->
  <text x="35" y="112" class="bold-txt" font-size="9" fill="#B91C1C" font-style="italic">Instructions: All details to be filled in Block Letters</text>
  <text x="35" y="123" class="norm-txt" font-size="7.8" fill="#000000">To be printed on plain A4 paper size; Not required to be printed on letter head;</text>
  <text x="565" y="112" class="norm-txt" font-size="7.8" fill="#334155">(To be valid for 3 months from date of issue)</text>

  <!-- Date Box Grid Header (D D M M Y Y Y Y) -->
  <text x="590" y="125" class="norm-txt" font-size="7" fill="#64748B">D</text>
  <text x="607" y="125" class="norm-txt" font-size="7" fill="#64748B">D</text>
  <text x="624" y="125" class="norm-txt" font-size="7" fill="#64748B">M</text>
  <text x="641" y="125" class="norm-txt" font-size="7" fill="#64748B">M</text>
  <text x="658" y="125" class="norm-txt" font-size="7" fill="#64748B">Y</text>
  <text x="675" y="125" class="norm-txt" font-size="7" fill="#64748B">Y</text>
  <text x="692" y="125" class="norm-txt" font-size="7" fill="#64748B">Y</text>
  <text x="709" y="125" class="norm-txt" font-size="7" fill="#64748B">Y</text>

  <!-- Navy Section 1 Banner -->
  <rect x="35" y="132" width="724" height="19" fill="#1B2A4A"/>
  <text x="397" y="145" class="bold-txt" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">INDIVIDUAL SEEKING TO ENROL / AADHAAR NUMBER HOLDER DETAILS</text>

  <!-- Labels -->
  <text x="35" y="196" class="bold-txt" font-size="8.5" fill="#000000">Aadhaar Number:</text>
  <text x="35" y="206" class="norm-txt" font-size="7" fill="#475569">(For update only)</text>
  <text x="35" y="222" class="bold-txt" font-size="8.5" fill="#000000">Full Name:</text>
  <text x="35" y="278" class="bold-txt" font-size="8.5" fill="#000000">House No./ Bldg./ Apt:</text>
  <text x="35" y="334" class="bold-txt" font-size="8.5" fill="#000000">Street/ Road/ Lane:</text>
  <text x="35" y="390" class="bold-txt" font-size="8.5" fill="#000000">Landmark:</text>
  <text x="35" y="446" class="bold-txt" font-size="8.5" fill="#000000">Area/ Locality/ Sector:</text>
  <text x="35" y="502" class="bold-txt" font-size="8.5" fill="#000000">Village/ Town/ City:</text>
  <text x="35" y="558" class="bold-txt" font-size="8.5" fill="#000000">Post Office:</text>
  <text x="35" y="614" class="bold-txt" font-size="8.5" fill="#000000">District:</text>
  <text x="35" y="670" class="bold-txt" font-size="8.5" fill="#000000">State:</text>
  <text x="35" y="726" class="bold-txt" font-size="8.5" fill="#000000">PIN Code:</text>

  <!-- Right Column: Photo Frame -->
  <rect x="620" y="500" width="139" height="152" fill="#FAFAFA" stroke="#000000" stroke-width="0.8"/>
  <text x="689" y="525" class="norm-txt" font-size="7.2" fill="#000000" text-anchor="middle">Individual Seeking to Enrol/</text>
  <text x="689" y="535" class="norm-txt" font-size="7.2" fill="#000000" text-anchor="middle">Aadhaar Number Holder</text>
  <text x="689" y="546" class="norm-txt" font-size="7.2" fill="#000000" text-anchor="middle">Recent Colour Passport-Size</text>
  <text x="689" y="557" class="norm-txt" font-size="7.2" fill="#000000" text-anchor="middle">Photograph.</text>
  <text x="689" y="575" class="norm-txt" font-size="7" fill="#000000" text-anchor="middle">Cross Signed and</text>
  <text x="689" y="585" class="norm-txt" font-size="7" fill="#000000" text-anchor="middle">Cross Stamped</text>
  <text x="689" y="595" class="norm-txt" font-size="7" fill="#000000" text-anchor="middle">by the Certifier.</text>
  <text x="689" y="612" class="bold-txt" font-size="6.8" fill="#000000" text-anchor="middle">NB: DO NOT</text>
  <text x="689" y="621" class="bold-txt" font-size="6.8" fill="#000000" text-anchor="middle">OVERLAP WITH</text>
  <text x="689" y="630" class="bold-txt" font-size="6.8" fill="#000000" text-anchor="middle">TEXT BOXES.</text>

  <!-- Right Column: Signature Box -->
  <rect x="420" y="580" width="190" height="92" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>
  <text x="515" y="658" class="norm-txt" font-size="6.5" fill="#000000" text-anchor="middle">Signature/ Thumb/ Finger Impression of</text>
  <text x="515" y="667" class="norm-txt" font-size="6.5" fill="#000000" text-anchor="middle">Individual Seeking to Enrol/ Aadhaar Number Holder</text>

  <!-- Green Section 2: Certifier Banner -->
  <rect x="35" y="744" width="724" height="19" fill="#E2FBE8" stroke="#86EFAC" stroke-width="0.8"/>
  <text x="397" y="757" class="bold-txt" font-size="9.5" fill="#064E3B" text-anchor="middle" letter-spacing="0.5">CERTIFIER’S DETAILS (TO BE FILLED BY THE CERTIFIER ONLY)</text>

  <!-- Certifier Labels -->
  <text x="35" y="785" class="bold-txt" font-size="8.5" fill="#000000">Name of the Certifier:</text>
  <text x="35" y="830" class="bold-txt" font-size="8.5" fill="#000000">Designation:</text>
  <text x="35" y="875" class="bold-txt" font-size="8.5" fill="#000000">Office Address:</text>
  <text x="35" y="930" class="bold-txt" font-size="8.5" fill="#000000">Contact Number:</text>

  <!-- Certifier Summary Bottom Grid Box -->
  <rect x="35" y="945" width="724" height="135" fill="#FFFFFF" stroke="#000000" stroke-width="0.8"/>
  <line x1="285" y1="945" x2="285" y2="1080" stroke="#CBD5E1" stroke-width="0.8"/>
  <line x1="535" y1="945" x2="535" y2="1080" stroke="#CBD5E1" stroke-width="0.8"/>

  <!-- Certifier Categories Left -->
  <text x="42" y="958" class="bold-txt" font-size="6.8" fill="#000000">I hereby certify above mentioned details of the Individual seeking</text>
  <text x="42" y="967" class="bold-txt" font-size="6.8" fill="#000000">to enrol /Aadhaar number holder and i am a.... (Tick appropriate box below)</text>

  <!-- Checklist Middle -->
  <text x="410" y="958" class="bold-txt" font-size="7.5" fill="#000000" text-anchor="middle">CHECKLIST FOR CERTIFIER</text>
  <line x1="295" y1="963" x2="525" y2="963" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="312" y="976" class="norm-txt" font-size="6.8" fill="#000000">No overwriting</text>
  <text x="312" y="990" class="norm-txt" font-size="6.8" fill="#000000">Issue date is filled</text>
  <text x="312" y="1004" class="norm-txt" font-size="6.8" fill="#000000">Resident’s signature</text>
  <text x="312" y="1018" class="norm-txt" font-size="6.8" fill="#000000">Certifier’s details</text>
  <text x="312" y="1032" class="norm-txt" font-size="6.8" fill="#000000">Resident’s Photo is cross signed &amp; stamped</text>

  <!-- Stamp Right -->
  <text x="645" y="1068" class="bold-txt" font-size="7" fill="#000000" text-anchor="middle">Signature &amp; Stamp of the Certifier</text>

  <!-- Footer Notes -->
  <line x1="35" y1="1090" x2="759" y2="1090" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="35" y="1100" class="bold-txt" font-size="6.8" fill="#334155">*To be used as Proof of Identity (PoI) only in specific cases as mentioned in the list of applicable supporting documents.</text>
  <text x="397" y="1112" class="bold-txt" font-size="9" fill="#D97706" text-anchor="middle">Mera Aadhaar, Meri Pehchaan</text>
</svg>
