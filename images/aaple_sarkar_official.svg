<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Gradients for official colors -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7722" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#0E7034" />
    </linearGradient>
    <linearGradient id="goldRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Outer Badge Background -->
  <circle cx="250" cy="250" r="235" fill="url(#shieldBg)" stroke="url(#goldRingGrad)" stroke-width="12" filter="url(#softShadow)" />
  <circle cx="250" cy="250" r="220" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Top Header Text: MAHARASHTRA GOVERNMENT -->
  <path id="textPathTop" d="M 90,250 A 160,160 0 0,1 410,250" fill="none" />
  <text font-family="'Mukta', 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-weight="800" font-size="20" fill="#B45309" letter-spacing="3">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      ★ महाराष्ट्र शासन • आपले सरकार ★
    </textPath>
  </text>

  <!-- Central Emblem Group -->
  <g transform="translate(0, 10)">
    <!-- Maharashtra Rajmudra / Golden Sun Aura -->
    <circle cx="250" cy="180" r="75" fill="#FEF3C7" opacity="0.4" />
    
    <!-- Vidhan Bhavan Dome Architecture Motif (Official Symbol) -->
    <!-- Dome Base & Pillars -->
    <path d="M 195 195 L 305 195 L 300 205 L 200 205 Z" fill="#F97316" />
    <!-- Pillars -->
    <rect x="208" y="172" width="6" height="23" rx="2" fill="#0E7034" />
    <rect x="222" y="172" width="6" height="23" rx="2" fill="#0E7034" />
    <rect x="236" y="172" width="6" height="23" rx="2" fill="#0E7034" />
    <rect x="250" y="172" width="6" height="23" rx="2" fill="#0E7034" />
    <rect x="264" y="172" width="6" height="23" rx="2" fill="#0E7034" />
    <rect x="278" y="172" width="6" height="23" rx="2" fill="#0E7034" />
    <rect x="292" y="172" width="6" height="23" rx="2" fill="#0E7034" />
    <!-- Upper Dome Arc -->
    <path d="M 205 172 C 205 130, 295 130, 295 172 Z" fill="#16A34A" />
    <!-- Dome Top Kalash / Spire -->
    <path d="M 247 130 L 253 130 L 251 115 L 249 115 Z" fill="#F59E0B" />
    <circle cx="250" cy="112" r="3.5" fill="#E65100" />
    <!-- Tricolor Saffron Arch Accent Over Dome -->
    <path d="M 190 185 C 190 100, 310 100, 310 185" fill="none" stroke="#FF7722" stroke-width="5" stroke-linecap="round" />

    <!-- Official Marathi Typography "आपले सरकार" -->
    <!-- आपले in official Green -->
    <text x="250" y="275" font-family="'Mukta', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#0E7034" text-anchor="middle" letter-spacing="1">
      आपले
    </text>

    <!-- सरकार in official Saffron / Orange -->
    <text x="250" y="340" font-family="'Mukta', 'Arial Black', sans-serif" font-weight="900" font-size="68" fill="#F15A24" text-anchor="middle" letter-spacing="2">
      सरकार
    </text>

    <!-- Sub-heading: सेवा केंद्र -->
    <g transform="translate(145, 360)">
      <rect x="0" y="0" width="210" height="36" rx="18" fill="url(#saffronGrad)" />
      <text x="105" y="24" font-family="'Mukta', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
        सेवा केंद्र
      </text>
    </g>
  </g>

  <!-- Bottom Tagline / Verification -->
  <path id="textPathBottom" d="M 410,255 A 165,165 0 0,1 90,255" fill="none" />
  <text font-family="'Mukta', 'Poppins', sans-serif" font-weight="700" font-size="14" fill="#64748B" letter-spacing="2">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      AAPLE SARKAR SEVA KENDRA • KANKAVLI
    </textPath>
  </text>
</svg>
