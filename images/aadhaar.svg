<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <linearGradient id="aadhaarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E23E1D" />
      <stop offset="100%" stop-color="#B22206" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Aadhaar Sun Rays & Fingerprint Motif -->
  <g transform="translate(15, 10)">
    <!-- Sun Rays -->
    <path d="M 50 15 L 50 2 M 68 22 L 78 12 M 78 40 L 90 40 M 74 58 L 84 68 M 60 74 L 66 86 M 40 74 L 34 86 M 26 58 L 16 68 M 22 40 L 10 40 M 32 22 L 22 12" stroke="#E23E1D" stroke-width="4" stroke-linecap="round" />
    
    <!-- Red Flame / Sun Core -->
    <path d="M 32 50 C 32 30, 68 30, 68 50 C 68 62, 58 70, 50 75 C 42 70, 32 62, 32 50 Z" fill="url(#aadhaarGrad)" />
    
    <!-- Fingerprint lines inside -->
    <path d="M 42 52 C 42 45, 58 45, 58 52 C 58 58, 52 62, 50 65 C 48 62, 42 58, 42 52 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 46 54 C 46 50, 54 50, 54 54 C 54 57, 50 59, 50 61" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    
    <!-- Central dot / bindu -->
    <circle cx="50" cy="46" r="2" fill="#FFFFFF" />
  </g>

  <!-- Aadhaar Official Text -->
  <g transform="translate(125, 20)">
    <!-- Hindi / Marathi Text -->
    <text x="0" y="32" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-weight="800" font-size="28" fill="#E23E1D" letter-spacing="0.5">आधार</text>
    
    <!-- English Text -->
    <text x="0" y="58" font-family="'Poppins', 'Arial', sans-serif" font-weight="800" font-size="22" fill="#334155" letter-spacing="2">AADHAAR</text>
    
    <!-- Tagline -->
    <text x="0" y="78" font-family="'Mukta', sans-serif" font-weight="600" font-size="11" fill="#64748B">आम आदमी का अधिकार</text>
  </g>
</svg>
