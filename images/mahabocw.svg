<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <linearGradient id="mahaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="safetyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Mahabocw Safety Helmet / Shasan Motif -->
  <g transform="translate(20, 15)">
    <!-- Outer Shield -->
    <circle cx="45" cy="45" r="42" fill="#FFFBEB" stroke="url(#mahaGrad)" stroke-width="2.5" />
    <circle cx="45" cy="45" r="36" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="4 2" />
    
    <!-- Construction Safety Helmet Icon -->
    <!-- Helmet Dome -->
    <path d="M 28 46 C 28 30, 62 30, 62 46 Z" fill="url(#safetyGrad)" stroke="#B45309" stroke-width="1.5" />
    <!-- Helmet Brim -->
    <path d="M 22 46 C 22 44, 68 44, 68 46 C 68 50, 22 50, 22 46 Z" fill="#D97706" />
    <!-- Helmet Center Ridge -->
    <path d="M 42 32 L 48 32 L 48 46 L 42 46 Z" fill="#FEF3C7" opacity="0.8" />
    
    <!-- Tool / Trowel / Gear Accent -->
    <path d="M 36 56 L 45 64 L 54 56" fill="none" stroke="#B45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Text Section -->
  <g transform="translate(115, 18)">
    <text x="0" y="22" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-weight="800" font-size="18" fill="#B45309">महाराष्ट्र शासन</text>
    <text x="0" y="42" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-weight="700" font-size="13" fill="#1E293B">बांधकाम कामगार कल्याण मंडळ</text>
    
    <!-- BOCW Badge -->
    <rect x="0" y="56" width="165" height="24" rx="12" fill="url(#mahaGrad)" />
    <text x="82" y="72" font-family="'Poppins', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MAHABOCW SEVA</text>
  </g>
</svg>
