<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>आधार फॉर्म (Direct Online Filing)</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- PDF.js and PDF Viewer styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
    <script>
        // PDF.js v3.11 bugfix: AnnotationEditorLayerBuilder.cancel() crashes with
        // "Cannot read properties of null (reading 'destroy')" when cancelling rendering.
        if (window.pdfjsViewer && window.pdfjsViewer.PDFPageView) {
            const origCancelRendering = pdfjsViewer.PDFPageView.prototype.cancelRendering;
            pdfjsViewer.PDFPageView.prototype.cancelRendering = function(options) {
                try {
                    if (this.annotationEditorLayer) {
                        if (!this.annotationEditorLayer.annotationEditorLayer || typeof this.annotationEditorLayer.annotationEditorLayer.destroy !== 'function') {
                            this.annotationEditorLayer.annotationEditorLayer = { destroy: function() {} };
                        }
                        const proto = Object.getPrototypeOf(this.annotationEditorLayer);
                        if (proto && !proto.__safeDestroyPatched) {
                            proto.__safeDestroyPatched = true;
                            proto.cancel = function() {
                                this._cancelled = true;
                                if (!this.div) return;
                                this.pageDiv = null;
                                if (this.annotationEditorLayer && typeof this.annotationEditorLayer.destroy === 'function') {
                                    try { this.annotationEditorLayer.destroy(); } catch (e) {}
                                }
                                if (this.div && typeof this.div.remove === 'function') {
                                    try { this.div.remove(); } catch (e) {}
                                }
                            };
                        }
                    }
                } catch (patchErr) {
                    console.warn("Patch error:", patchErr);
                }
                try {
                    return origCancelRendering.call(this, options);
                } catch (renderErr) {
                    console.warn("Handled cancelRendering error:", renderErr);
                }
            };
        }
    </script>
    
    <!-- PDF-Lib for flattening -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <!-- Embedded Offline/Local PDF Data for file:/// and instant loading -->
    <script src="js/aadhaar-pdf-data.js"></script>

    <style>
        :root {
            --primary-navy: #0d1b2a;
            --primary-dark: #091322;
            --primary-blue: #1e3a8a;
            --primary-cyan: #3b82f6;
            --saffron-orange: #fb923c;
            --saffron-glow: rgba(251, 146, 60, 0.4);
            --gov-gold: #fbbf24;
            --bg-viewer: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Mukta', 'Poppins', sans-serif;
            background-color: var(--bg-viewer);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Government Tricolor Glow Stripe */
        .gov-tricolor-stripe {
            height: 3px;
            background: linear-gradient(90deg, #ff7700 0%, #ff7700 33.3%, #ffffff 33.3%, #ffffff 66.6%, #138808 66.6%, #138808 100%);
            width: 100%;
            box-shadow: 0 0 10px rgba(255, 119, 0, 0.5);
            z-index: 20;
        }

        /* Glamorous Glassmorphism Top Navbar */
        .top-navbar {
            background: linear-gradient(135deg, rgba(11, 37, 69, 0.95) 0%, rgba(7, 25, 46, 0.98) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #ffffff;
            padding: 0.75rem 1.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 25px rgba(2, 132, 199, 0.15);
            z-index: 10;
        }

        .back-btn {
            color: #ffffff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.45rem 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .back-btn:hover {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.35) 0%, rgba(56, 189, 248, 0.2) 100%);
            color: #ffffff;
            border-color: var(--primary-cyan);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
        }

        .brand-heading {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            letter-spacing: 0.3px;
        }

        .brand-heading i {
            color: #ef4444;
            font-size: 1.4rem;
            filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6));
        }

        .page-badge {
            background: linear-gradient(135deg, rgba(255, 119, 0, 0.25) 0%, rgba(251, 191, 36, 0.25) 100%);
            color: #fef08a;
            border: 1px solid rgba(251, 191, 36, 0.4);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 2px 8px rgba(251, 191, 36, 0.2);
        }

        .page-badge::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
            display: inline-block;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }


        /* PDF Viewer Container Wrapper */
        .pdf-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* The container passed to pdfViewer must be absolutely positioned */
        .pdf-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: auto;
            background: radial-gradient(circle at center, #1e293b 0%, #0b1329 100%);
        }

        /* Customizing the viewer page to look centered like a standard viewer */
        .pdfViewer .page {
            margin: 24px auto;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 25px rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* High-Contrast Crisp AcroForm Field Styling */
        .annotationLayer input,
        .annotationLayer textarea,
        .annotationLayer select {
            color: #0f172a !important;
            font-weight: 700 !important;
            font-family: 'Mukta', 'Roboto Mono', sans-serif !important;
            background: rgba(239, 246, 255, 0.85) !important;
            border: 1px solid rgba(2, 132, 199, 0.4) !important;
            border-radius: 2px !important;
            transition: all 0.2s ease !important;
        }

        .annotationLayer input:focus,
        .annotationLayer textarea:focus,
        .annotationLayer select:focus {
            background: #ffffff !important;
            border-color: #0284c7 !important;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.4) !important;
            outline: none !important;
        }
        
        /* Glamorous Glass Loading Overlay */
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 25, 46, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            z-index: 50;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .glamour-spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--saffron-orange);
            border-right: 4px solid var(--primary-cyan);
            border-radius: 50%;
            animation: spinGlamour 0.9s linear infinite;
            box-shadow: 0 0 20px rgba(255, 119, 0, 0.4);
        }

        @keyframes spinGlamour {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Glamorous Glowing Download Button */
        .btn-download-glamour {
            background: linear-gradient(135deg, #ff7700 0%, #d95300 50%, #b43e00 100%);
            color: #ffffff !important;
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-weight: 800;
            font-size: 0.96rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Mukta', sans-serif;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            box-shadow: 0 4px 15px rgba(255, 119, 0, 0.45), 0 0 20px rgba(255, 119, 0, 0.25);
            position: relative;
            overflow: hidden;
        }

        .btn-download-glamour::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: rotate(25deg);
            animation: shineGlamour 4s infinite;
        }

        @keyframes shineGlamour {
            0%, 60% { left: -60%; }
            100% { left: 140%; }
        }

        .btn-download-glamour:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 25px rgba(255, 119, 0, 0.6), 0 0 30px rgba(255, 119, 0, 0.4);
            border-color: #fef08a;
        }

        .btn-download-glamour:active {
            transform: translateY(0) scale(0.98);
        }

        /* 🎛️ Form Switcher Bar Styles */
        .form-switcher-bar {
            background: linear-gradient(180deg, rgba(13, 27, 42, 0.98) 0%, rgba(9, 19, 34, 0.98) 100%);
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
            padding: 0.55rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .form-switcher-container {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1400px;
            width: 100%;
        }

        .switcher-title {
            color: #94a3b8;
            font-size: 0.88rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            white-space: nowrap;
        }

        .switcher-title i {
            color: #fbbf24;
            font-size: 1rem;
        }

        .switcher-buttons {
            display: inline-flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .form-select-btn {
            background: rgba(255, 255, 255, 0.06);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.16);
            padding: 0.45rem 1.05rem;
            border-radius: 8px;
            font-size: 0.86rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .form-select-btn:hover {
            background: rgba(59, 130, 246, 0.22);
            color: #ffffff;
            border-color: rgba(96, 165, 250, 0.6);
            transform: translateY(-1.5px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .form-select-btn.active {
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
            color: #ffffff;
            border-color: #93c5fd;
            box-shadow: 0 0 16px rgba(37, 99, 235, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        .form-select-btn.active i {
            color: #fef08a;
            filter: drop-shadow(0 0 6px rgba(254, 240, 138, 0.8));
        }

        @media (max-width: 768px) {
            .form-switcher-bar {
                padding: 0.5rem 0.75rem;
            }
            .form-select-btn {
                font-size: 0.8rem;
                padding: 0.4rem 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="gov-tricolor-stripe"></div>

    <nav class="top-navbar">
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            <span>मागे जा (Back)</span>
        </a>
        
        <div class="brand-heading">
            <i class="fa-solid fa-file-pdf"></i>
            <span>आधार फॉर्म फिलर</span>
            <span class="page-badge" id="active-form-badge">Standard Form</span>
        </div>

        <div class="action-group">
            <button id="btn-download" class="btn-download-glamour" onclick="downloadFlattenedPDF()">
                <i class="fa-solid fa-download"></i>
                <span>फॉर्म डाऊनलोड करा (Download PDF)</span>
            </button>
        </div>
    </nav>

    <!-- 🎛️ MULTI-FORM SELECTOR STRIP -->
    <div class="form-switcher-bar">
        <div class="form-switcher-container">
            <span class="switcher-title"><i class="fa-solid fa-layer-group"></i> फॉर्म निवडा:</span>
            <div class="switcher-buttons">
                <button type="button" class="form-select-btn active" id="btn-form-standard" onclick="selectForm('standard')">
                    <i class="fa-solid fa-file-shield"></i>
                    <span>१. सामान्य आधार प्रमाणपत्र (Standard)</span>
                </button>
                <button type="button" class="form-select-btn" id="btn-form-destitute" onclick="selectForm('destitute')">
                    <i class="fa-solid fa-wheelchair"></i>
                    <span>२. निराधार/दिव्यांग व्यक्ती (१८+ वर्षे)</span>
                </button>
                <button type="button" class="form-select-btn" id="btn-form-childcare" onclick="selectForm('childcare')">
                    <i class="fa-solid fa-child-reaching"></i>
                    <span>३. बालगृह बालके (DCPO Form)</span>
                </button>
            </div>
        </div>
    </div>

    <div class="pdf-wrapper">
        <div id="loading-overlay">
            <div class="glamour-spinner"></div>
            <span>PDF लोड होत आहे... कृपया थांबा.</span>
        </div>
        <div id="viewerContainer" class="pdf-container">
            <div id="viewer" class="pdfViewer"></div>
        </div>
    </div>

    <script>
        // Forms Configuration for all 3 Aadhaar Enrolment Forms
        const AADHAAR_FORMS = {
            standard: {
                id: 'standard',
                name: '१. सामान्य आधार प्रमाणपत्र (Standard)',
                badge: 'General Enrolment / Update',
                fileName: 'aadhaar_original.pdf',
                base64Key: 'AADHAAR_ORIGINAL_PDF_BASE64',
                downloadName: 'Aadhaar_Standard_Enrolment_Certificate_Filled.pdf'
            },
            destitute: {
                id: 'destitute',
                name: '२. निराधार/दिव्यांग व्यक्ती (१८+ वर्षे)',
                badge: 'Destitute with Disability (18+)',
                fileName: 'aadhaar_destitute.pdf',
                base64Key: 'AADHAAR_DESTITUTE_PDF_BASE64',
                downloadName: 'Aadhaar_Certificate_Destitute_Disability_Filled.pdf'
            },
            childcare: {
                id: 'childcare',
                name: '३. बालगृह बालके (DCPO Form)',
                badge: 'Children in CCI (DCPO)',
                fileName: 'aadhaar_child_care.pdf',
                base64Key: 'AADHAAR_CHILD_CARE_PDF_BASE64',
                downloadName: 'Aadhaar_Certificate_Child_Care_DCPO_Filled.pdf'
            }
        };

        // State Tracking
        let currentFormKey = 'standard';
        let currentPdfDocument = null;
        let pdfViewer = null;
        let linkService = null;
        let eventBus = null;

        // Set pdf.js worker path
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Helper: Convert Base64 string to Uint8Array for offline/local file:/// loading
        function base64ToUint8Array(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes;
        }

        // Cleanly initialize/render PDF in viewer container without dirty state collisions
        function renderDocumentInViewer(pdfDoc) {
            const container = document.getElementById('viewerContainer');
            // Cleanly reset viewer DOM
            container.scrollTop = 0;
            container.innerHTML = '<div id="viewer" class="pdfViewer"></div>';

            eventBus = new pdfjsViewer.EventBus();
            linkService = new pdfjsViewer.PDFLinkService({ eventBus: eventBus });

            pdfViewer = new pdfjsViewer.PDFViewer({
                container: container,
                eventBus: eventBus,
                linkService: linkService,
                renderInteractiveForms: true
            });

            linkService.setViewer(pdfViewer);

            eventBus.on('pagesinit', function () {
                pdfViewer.currentScaleValue = 'page-width';
            });

            pdfViewer.setDocument(pdfDoc);
            linkService.setDocument(pdfDoc, null);
        }

        // Manual PDF file selection fallback handler
        function handleManualPdfUpload(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const typedarray = new Uint8Array(e.target.result);
                    const loadingTask = pdfjsLib.getDocument({ data: typedarray });
                    currentPdfDocument = await loadingTask.promise;
                    renderDocumentInViewer(currentPdfDocument);
                    const loadingOverlay = document.getElementById('loading-overlay');
                    if (loadingOverlay) loadingOverlay.style.display = 'none';
                } catch (err) {
                    alert("निवडलेली PDF लोड करता आली नाही: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // Select & Switch Aadhaar Form dynamically
        async function selectForm(formKey) {
            if (!AADHAAR_FORMS[formKey]) return;
            currentFormKey = formKey;
            const config = AADHAAR_FORMS[formKey];

            // 1. Update button active states
            document.querySelectorAll('.form-select-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('btn-form-' + formKey);
            if (activeBtn) activeBtn.classList.add('active');

            // 2. Update page badge
            const badge = document.getElementById('active-form-badge');
            if (badge) badge.textContent = config.badge;

            // 3. Show loading overlay
            const loadingOverlay = document.getElementById('loading-overlay');
            if (loadingOverlay) {
                loadingOverlay.style.display = 'flex';
                loadingOverlay.innerHTML = `
                    <div class="glamour-spinner"></div>
                    <span>${config.name} लोड होत आहे... कृपया थांबा.</span>
                `;
            }

            try {
                let loadingTask = null;
                currentPdfDocument = null;

                // Priority 1: Use embedded Base64 PDF data (avoids file:/// CORS & offline 404s)
                const base64Data = window[config.base64Key];
                if (base64Data) {
                    try {
                        const pdfData = base64ToUint8Array(base64Data);
                        loadingTask = pdfjsLib.getDocument({ data: pdfData });
                        currentPdfDocument = await loadingTask.promise;
                    } catch (b64Err) {
                        console.warn("Base64 load failed for " + formKey + ", attempting file URL fallback:", b64Err);
                    }
                }

                // Priority 2: Fallback to local/web URL if base64 was missing
                if (!currentPdfDocument) {
                    const isFileProtocol = window.location.protocol === 'file:';
                    const pdfUrl = isFileProtocol ? config.fileName : (config.fileName + '?v=' + Date.now());
                    loadingTask = pdfjsLib.getDocument(pdfUrl);
                    currentPdfDocument = await loadingTask.promise;
                }

                // Render PDF cleanly in viewer
                renderDocumentInViewer(currentPdfDocument);

                if (loadingOverlay) loadingOverlay.style.display = 'none';
            } catch (error) {
                console.error("Error loading PDF for " + formKey + ":", error);
                if (loadingOverlay) {
                    loadingOverlay.innerHTML = `
                        <div style="text-align: center; color: #fca5a5; max-width: 520px; padding: 2rem; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(239, 68, 68, 0.5); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                            <i class="fa-solid fa-triangle-exclamation" style="font-size: 2.5rem; color: #ef4444; margin-bottom: 1rem;"></i>
                            <h3 style="font-size: 1.2rem; margin-bottom: 0.5rem; color: #fff;">फॉर्म लोड करताना एरर आली</h3>
                            <p style="font-size: 0.88rem; color: #cbd5e1; margin-bottom: 1.2rem; word-break: break-all;">${error.message || 'फाइल उघडता आली नाही.'}</p>
                            <div style="display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap;">
                                <button onclick="selectForm('${formKey}')" style="background: #3b82f6; color: white; border: none; padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.9rem;">
                                    <i class="fa-solid fa-rotate-right"></i> पुन्हा प्रयत्न करा (Retry)
                                </button>
                                <label style="display: inline-flex; align-items: center; gap: 0.4rem; background: #16a34a; color: white; padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.9rem;">
                                    <i class="fa-solid fa-folder-open"></i> मॅन्युअली PDF निवडा
                                    <input type="file" accept="application/pdf" style="display:none;" onchange="handleManualPdfUpload(this)">
                                </label>
                            </div>
                        </div>
                    `;
                }
            }
        }

        // PDF Viewer Initialization
        async function initViewer() {
            try {
                // Load initial form from URL hash if provided (#destitute or #childcare), else standard
                const hash = window.location.hash ? window.location.hash.replace('#', '').toLowerCase() : '';
                const initialForm = AADHAAR_FORMS[hash] ? hash : 'standard';
                await selectForm(initialForm);
            } catch (error) {
                console.error("Error initializing viewer:", error);
            }
        }

        // Flatten & Download Core Logic
        async function downloadFlattenedPDF() {
            const btn = document.getElementById('btn-download');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing PDF...';
            btn.disabled = true;

            try {
                if (!currentPdfDocument) throw new Error("PDF लोड झालेली नाही.");
                const config = AADHAAR_FORMS[currentFormKey] || AADHAAR_FORMS.standard;

                // 1. Extract filled values from pdf.js annotation storage
                const filledPdfData = await currentPdfDocument.saveDocument();
                
                // 2. Load into pdf-lib
                const pdfDoc = await PDFLib.PDFDocument.load(filledPdfData);
                
                // 3. Flatten form fields (locks input into static document)
                try {
                    const form = pdfDoc.getForm();
                    form.flatten();
                } catch (flattenErr) {
                    console.warn("No form fields to flatten or already flattened:", flattenErr);
                }
                
                // 4. Save and trigger clean download
                const flattenedBytes = await pdfDoc.save();
                const blob = new Blob([flattenedBytes], { type: 'application/pdf' });
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = config.downloadName;
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);

            } catch (error) {
                console.error("Error flattening PDF:", error);
                alert("PDF डाऊनलोड करताना एरर आली: " + error.message);
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        window.addEventListener("DOMContentLoaded", initViewer);
    </script>
</body>
</html>
